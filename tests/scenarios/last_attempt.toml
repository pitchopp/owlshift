# OWL-183's acceptance, played by crates/owlshift-testkit/tests/scenarios.rs.
# It plays on the numbering/ fixture folder (the project in repo/, prepared
# results/): the three results with q1-only or q2 or q1 in their names are its
# own.

fixture = "numbering"
description = """
DEMO-4 with a failed run already counted when its Build result is refused.
Round 1 asks Q1. The first answer check crashes, a failed run counted at Build,
the stage it returns to; the second resumes Build. The Build run that follows
goes on from the thread's numbering and asks its one question as Q2: its result
is refused at the stage's last attempt. A refused result never spends that
attempt: nothing is posted or parked, the count stays, and the next Build run,
told why in its brief, opens round 2 with Q1."""
ticket = "DEMO-4"
start = "2026-10-07T10:00:00Z"

[[step]]
dispatch = true
expect = { event = "dispatched", stage = "build" }

[[step]]
run = { result = "results/questions-round1-q1-only.json" }
expect = { event = "questions", round = 1, failed_runs = 0, comments = 1 }

[[step]]
comment = { author = "maintainer", body = "Q1: English.\n" }

[[step]]
answer = { stderr = "fatal: out of memory\n", exit_code = 101 }
expect = { event = "run_failed", waiting = "needs_input", round = 1, failed_runs = 1, comments = 2 }

[[step]]
answer = { result = "results/check-round1-q1-answered.json" }
[step.expect]
event = "answered"
stage = "build"
waiting = "none"
failed_runs = 1
tracker_stage = "In Progress"
comments = 3
last_comment = { first_line = "[owlshift] RESUME · round 1" }

# One failed run counted: this refusal would be the second.
[[step]]
run = { result = "results/questions-round2-continued-q2.json" }
[step.expect]
event = "result_refused"
stage = "build"
waiting = "none"
round = 1
failed_runs = 1
tracker_stage = "In Progress"
comments = 3
brief_result_refusal = "none"

[[step]]
run = { result = "results/questions-round2.json" }
[step.expect]
event = "questions"
waiting = "needs_input"
round = 2
failed_runs = 1
tracker_stage = "Needs Input"
comments = 4
brief_result_refusal = "question Q2 is out of order: expected Q1"
[step.expect.last_comment]
author = "owlshift"
first_line = "[owlshift] QUESTIONS · round 2"
contains = ["**Q1** (scope) Should the README link to the greeting?"]
lacks = ["**Q2**"]
