# OWL-190's acceptance, played by crates/owlshift-testkit/tests/scenarios.rs.
# It plays on the numbering/ fixture folder (the project in repo/, prepared
# results/): round 1 asks Q1 alone, so a check giving a verdict on Q2 is
# refused.

fixture = "numbering"
description = """
DEMO-4 with an answer check whose result is refused at the last attempt.
Round 1 asks Q1 and the decider answers it. The first check crashes, a failed
run counted. The second gives its verdict on Q2, which the round did not ask:
its result is refused, and it was told of no earlier refusal, so it never
spends the last attempt: no PARKED comment, nothing posted, the ticket still
waits with its count, and the latest ask keeps the reason. The next check,
told why, gives its verdict on Q1, and the round is answered."""
ticket = "DEMO-4"
start = "2026-10-08T09:00:00Z"

[[step]]
dispatch = true
expect = { event = "dispatched", stage = "build" }

[[step]]
run = { result = "results/questions-round1-q1-only.json" }
expect = { event = "questions", round = 1, failed_runs = 0, comments = 1 }

[[step]]
comment = { author = "maintainer", body = "Q1: English.\n" }

[[step]]
answer = { stderr = "fatal: out of memory\n", exit_code = 101 }
expect = { event = "run_failed", waiting = "needs_input", round = 1, failed_runs = 1, comments = 2 }

# One failed run counted: this refusal would be the second.
[[step]]
answer = { result = "results/check-round1-q2-answered.json" }
[step.expect]
event = "result_refused"
waiting = "needs_input"
round = 1
failed_runs = 1
tracker_stage = "Needs Input"
comments = 2
brief_result_refusal = "none"

[[step]]
answer = { result = "results/check-round1-q1-answered.json" }
[step.expect]
event = "answered"
stage = "build"
waiting = "none"
failed_runs = 1
tracker_stage = "In Progress"
comments = 3
brief_result_refusal = "the verdict for Q2 names a question the latest ask of round 1 did not ask"
last_comment = { first_line = "[owlshift] RESUME · round 1" }
