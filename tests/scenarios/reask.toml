# S2's re-ask, the P2 exit gate in small (OWL-116), played by
# crates/owlshift-testkit/tests/scenarios.rs. Its fixture folder is reask/: the
# project in repo/, prepared results in results/. Every answer step runs the
# answer check on the fake harness, through the executor.

description = """
DEMO-3 through two question rounds. Round 1 asks two questions; the decider
answers Q1 and half of Q2, so the answer check finds Q2 partial and a RE-ASK
asks Q2 alone. The decider asks back what it means: a counter-question, nothing
re-asked. Their answer then settles Q2 and the ticket resumes at Build. Round 2
asks one question; a check that gives its verdict on round 1's Q2 is refused, a
failed run, and is retried on the same answer, which settles it. The build is
then done and pushed."""
ticket = "DEMO-3"
start = "2026-09-28T09:00:00Z"

[[step]]
dispatch = true
expect = { event = "dispatched", stage = "build" }

[[step]]
run = { result = "results/questions-round1.json" }
[step.expect]
event = "questions"
waiting = "needs_input"
round = 1
tracker_stage = "Needs Input"
comments = 1
last_comment = { first_line = "[owlshift] QUESTIONS · round 1", contains = ["**Q1** (scope)", "**Q2** (scope)"] }

[[step]]
comment = { author = "maintainer", body = "Q1: English.\nQ2: \"Hello, reader.\"\n" }
expect = { event = "none", comments = 2 }

[[step]]
answer = { result = "results/check-round1-q2-partial.json" }
[step.expect]
event = "incomplete"
stage = "build"
waiting = "needs_input"
round = 1
reasks = 1
tracker_stage = "Needs Input"
comments = 3
brief_latest_ask = ["Q1", "Q2"]
brief_thread = ["decider"]
[step.expect.last_comment]
author = "owlshift"
first_line = "[owlshift] RE-ASK · round 1"
contains = [
  "(re-ask 1 of 3:",
  "**Q2** (scope) What should the greeting say, and should it end with a sign-off?",
  "Still open (partial): The words are given, but not whether the greeting ends with a sign-off.",
  '<!-- owlshift:{"format":1,"kind":"RE-ASK","ticket":"DEMO-3","round":1} -->',
]
lacks = ["**Q1**", "Which language"]

[[step]]
comment = { author = "maintainer", body = "Q2: what do you mean by a sign-off?\n" }
expect = { event = "none", comments = 4 }

[[step]]
answer = { result = "results/check-round1-q2-counter.json" }
expect = { event = "counter_question", waiting = "needs_input", round = 1, reasks = 1, comments = 4, brief_latest_ask = ["Q2"] }

[[step]]
comment = { author = "maintainer", body = "Q2: no sign-off then, just \"Hello, reader.\"\n" }
expect = { event = "none", comments = 5 }

[[step]]
answer = { result = "results/check-round1-q2-answered.json" }
[step.expect]
event = "answered"
stage = "build"
waiting = "none"
round = 1
reasks = 0
tracker_stage = "In Progress"
comments = 5
brief_latest_ask = ["Q2"]
brief_thread = ["decider", "decider", "decider"]

[[step]]
run = { result = "results/questions-round2.json" }
[step.expect]
event = "questions"
waiting = "needs_input"
round = 2
reasks = 0
tracker_stage = "Needs Input"
comments = 6
last_comment = { first_line = "[owlshift] QUESTIONS · round 2", contains = ["**Q1** (scope) Should the README link to the greeting?"] }

[[step]]
comment = { author = "maintainer", body = "Q1: no.\n" }
expect = { event = "none", comments = 7 }

[[step]]
answer = { result = "results/check-round1-q2-answered.json" }
expect = { event = "run_failed", waiting = "needs_input", round = 2, failed_runs = 1, comments = 7, brief_latest_ask = ["Q1"] }

[[step]]
answer = { result = "results/check-round2-q1-answered.json" }
expect = { event = "answered", stage = "build", waiting = "none", round = 2, failed_runs = 1, tracker_stage = "In Progress", comments = 7 }

[[step]]
[step.run]
files = { "GREETING.md" = "Hello, reader.\n" }
commit = "Add a greeting"
result = "results/build-done.json"
[step.expect]
event = "completed"
stage = "verify"
failed_runs = 0
brief_latest_ask = ["Q1"]
brief_thread = ["decider", "decider", "decider", "decider"]
branch_pushed = true
branch_files = { "GREETING.md" = "Hello, reader.\n" }
