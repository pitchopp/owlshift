# OWL-193's acceptance, played by crates/owlshift-testkit/tests/scenarios.rs.
# It plays on the open_points/ fixture folder (the project in repo/, prepared
# results/): questions-one-of-two.json is its own.

fixture = "open_points"
description = """
DEMO-5 leaves two points open, to be decided on the ticket. The first Build
run decides both itself: its result is refused. The next Build run is told
why and asks, but only the first point, naming it as the one refused choice
it asks and dropping the second: that result is refused before anything is
posted, and the ticket parks with a PARKED comment that says which choice was
not asked. After the restart, the Build run is told both choices and why the
last result was refused; it asks both, naming each, and round 1 opens."""
ticket = "DEMO-5"
start = "2026-10-08T15:00:00Z"

[[step]]
dispatch = true
expect = { event = "dispatched", stage = "build" }

[[step]]
[step.run]
files = { "examples/owlshift.toml" = "# Every key, commented.\n" }
commit = "Add the example configuration"
result = "results/build-decided.json"
[step.expect]
event = "result_refused"
failed_runs = 1
comments = 0

# Without the rule, this run's round asks Q1 only, and where the README lists
# the example is settled by the refused run's commit.
[[step]]
run = { result = "results/questions-one-of-two.json" }
[step.expect]
event = "run_failed"
stage = "build"
waiting = "parked"
failed_runs = 2
comments = 1
brief_decisions_refused = true
brief_refused_choices = ["Every key or only the required ones", "Where the README lists the example"]
[step.expect.last_comment]
author = "owlshift"
first_line = "[owlshift] PARKED"
contains = [
  "the refused choices are not all named as asked",
  "Not named: 2. The choices not named: 2 \"Where the README lists the example\"",
]

[[step]]
continue = true
expect = { event = "restarted", stage = "build", waiting = "none", failed_runs = 0 }

[[step]]
run = { result = "results/questions-open-points.json" }
[step.expect]
event = "none"
stage = "build"
waiting = "none"
comments = 1
brief_result_refusal = "A later result was refused too: invalid result.json: the refused choices are not all named as asked"
brief_decisions_refused = true
brief_refused_choices = ["Every key or only the required ones", "Where the README lists the example"]

[[step]]
resolve = { result = "results/resolver-decides-placement.json" }
[step.expect]
event = "questions"
waiting = "needs_input"
round = 1
comments = 3
brief_resolve = ["Q2"]
[step.expect.last_comment]
author = "owlshift"
first_line = "[owlshift] QUESTIONS · round 1"
contains = ["**Q1** (scope) Should the example show every key with comments, or only the required ones?"]
