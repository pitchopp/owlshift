[package]
name = "owlshift-platform"
description = "Owlshift operating-system integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dirs.workspace = true
keyring-core.workspace = true
which.workspace = true

# The system keychain takes one credential store per platform:
# zbus-secret-service on Unix systems other than macOS, windows-native on
# Windows. macOS needs none: its Keychain is reached through
# `/usr/bin/security` (OWL-335).
[target.'cfg(unix)'.dependencies]
# `termios`: the terminal's width, for `owlshift doctor`'s report (OWL-99).
rustix = { workspace = true, features = ["termios"] }
signal-hook.workspace = true

# The process table, searched for what left a process tree's group when the
# tree is stopped (OWL-451); the tests read a process's state with it too,
# with no `ps` (OWL-110).
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
