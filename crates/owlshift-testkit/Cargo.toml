[package]
name = "owlshift-testkit"
description = "Owlshift's test bench: fake harness, bare-remote fixture and scenario runner; test only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Test only: never published, and never a dependency of a shipped crate.
publish = false

[dependencies]
owlshift-core.workspace = true
owlshift-contracts.workspace = true
owlshift-adapters.workspace = true
# The bench runs the fake harness and the isolation scenarios bare, through
# the test-only `AgentEnv::without_confinement` (OWL-41).
owlshift-runner = { workspace = true, features = ["testkit"] }
# `gh::warm_up` starts gh with a deadline.
owlshift-platform.workspace = true
clap.workspace = true
jiff.workspace = true
serde.workspace = true
tempfile.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
