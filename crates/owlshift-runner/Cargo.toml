[package]
name = "owlshift-runner"
description = "Owlshift runner: the daemon that drives tickets through their pipelines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
owlshift-core.workspace = true
owlshift-contracts.workspace = true
owlshift-adapters.workspace = true
owlshift-platform.workspace = true
jiff.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
# The hash of a ticket's text an intake record keeps (OWL-248).
sha2.workspace = true
toml.workspace = true
# The local web UI (OWL-467): its token, its run secret and their MACs.
getrandom.workspace = true
hmac.workspace = true
# The web UI's synchronous HTTP server, on the socket the daemon hands over.
tiny_http.workspace = true
# Each run's own temporary folder, private to the user and removed with the
# run (OWL-41).
tempfile.workspace = true

[features]
# Test only: `AgentEnv::without_confinement`, for the test bench. No shipped
# crate enables it (OWL-41).
testkit = []
