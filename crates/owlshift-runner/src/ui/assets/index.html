<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Owlshift</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="bar-row">
    <span class="wordmark">owlshift</span>
    <label class="switch">
      <span class="switch-label">Project</span>
      <select id="project" class="control" aria-label="Project">
        <option value="">All projects</option>
      </select>
    </label>
    <label class="switch">
      <span class="switch-label">Theme</span>
      <select id="theme" class="control" aria-label="Theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </div>
  <div id="header" class="bar-row facts" hidden></div>
</header>
<main>
  <p id="logged-out" class="notice">Not logged in: run <code>owlshift ui</code> in a terminal.</p>
  <p id="problem" class="notice problem" hidden></p>
  <div id="home" hidden>
    <section id="for-you" class="home-section" aria-labelledby="for-you-title">
      <h2 id="for-you-title">For you</h2>
      <div id="for-you-body"></div>
    </section>
    <section id="overview" class="home-section" aria-labelledby="overview-title">
      <div class="section-head">
        <h2 id="overview-title">Overview</h2>
        <div class="view-switch" role="group" aria-label="View">
          <button type="button" id="view-columns" class="toggle" aria-pressed="true">Columns</button>
          <button type="button" id="view-list" class="toggle" aria-pressed="false">List</button>
        </div>
      </div>
      <div id="overview-body"></div>
    </section>
    <section id="since" class="home-section" aria-labelledby="since-title">
      <h2 id="since-title">Since your last visit</h2>
      <div id="since-body"></div>
    </section>
  </div>
  <section id="ticket" class="ticket" hidden></section>
</main>
</body>
</html>
