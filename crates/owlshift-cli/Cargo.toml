[package]
name = "owlshift-cli"
description = "The owlshift command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "owlshift"
path = "src/main.rs"

[dependencies]
owlshift-runner.workspace = true
owlshift-adapters.workspace = true
owlshift-contracts.workspace = true
owlshift-platform.workspace = true
clap.workspace = true
# Hidden input for the secrets `owlshift init` asks for on a terminal.
rpassword.workspace = true

[dev-dependencies]
# Reads `owlshift doctor --json` (OWL-99).
serde_json.workspace = true
tempfile.workspace = true

# Reads a process's state in the tests, with no `ps` (OWL-110).
[target.'cfg(target_os = "macos")'.dev-dependencies]
libc.workspace = true

# The Windows Ctrl-C test sends a console Ctrl-C (OWL-47).
[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true
