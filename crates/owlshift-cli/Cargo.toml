[package]
name = "owlshift-cli"
description = "The owlshift command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `cargo run -p owlshift-cli`, which the `cargo owl` alias runs, starts this
# one of the two binaries.
default-run = "owlshift"

[[bin]]
name = "owlshift"
path = "src/main.rs"

# Starts an agent command inside the run's Job Object on native Windows
# (OWL-71); installed next to `owlshift`, where the runner looks for it.
[[bin]]
name = "owlshift-launch"
path = "src/bin/owlshift-launch.rs"

[dependencies]
owlshift-runner.workspace = true
owlshift-adapters.workspace = true
owlshift-contracts.workspace = true
owlshift-platform.workspace = true
clap.workspace = true
# Hidden input for the secrets `owlshift init` asks for on a terminal.
rpassword.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The Windows Ctrl-C test sends a console Ctrl-C (OWL-47).
[target.'cfg(windows)'.dev-dependencies]
windows-sys.workspace = true
