# Jobs for bacon (https://dystroy.org/bacon/), which re-runs one on every save.
# See CONTRIBUTING.md, "Development".

default_job = "check"

# Same flags as the CI lint step.
[jobs.clippy-all]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--workspace"]
need_stdout = true

# `bacon owl -- doctor` rebuilds and re-runs `owlshift doctor` on every save.
[jobs.owl]
command = ["cargo", "run", "-q", "-p", "owlshift-cli", "--"]
need_stdout = true
allow_warnings = true
on_change_strategy = "kill_then_restart"
