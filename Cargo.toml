[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/pitchopp/owlshift"
publish = false

[workspace.dependencies]
owlshift-core = { path = "crates/owlshift-core" }
owlshift-contracts = { path = "crates/owlshift-contracts" }
owlshift-adapters = { path = "crates/owlshift-adapters" }
owlshift-platform = { path = "crates/owlshift-platform" }
owlshift-runner = { path = "crates/owlshift-runner" }
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
clap = { version = "4.6", features = ["derive", "string"] }
dirs = "7.0"
jiff = { version = "0.2", features = ["serde"] }
jsonschema = { version = "0.58", default-features = false }
keyring-core = "1.0"
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
schemars = { version = "1.2", features = ["jiff02"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
tempfile = "3.27"
toml = "1.1"
ureq = { version = "3.4", default-features = false, features = ["rustls", "json"] }
which = "8.0"
windows-native-keyring-store = "1.1"
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }
