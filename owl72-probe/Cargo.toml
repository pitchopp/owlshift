# Throwaway probe for OWL-72, run once on windows-latest by a temporary
# workflow; removed before the pull request. Its own workspace, so the
# repository's workspace, lints and lock file are untouched.
[package]
name = "owl72-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
