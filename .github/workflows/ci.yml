name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner images ship rustup; it installs the toolchain pinned in
      # rust-toolchain.toml, with rustfmt and clippy.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Show the toolchain
        run: cargo --version --verbose
      # OWL-289: the legs recompiled the workspace's dependencies on every
      # run. Swatinem/rust-cache keeps ~/.cargo's registry and the
      # dependencies' build artifacts, one cache per OS, keyed by the
      # toolchain and the Cargo files, so it comes after the toolchain
      # install and before the first cargo build. Default settings: a run
      # whose key is not cached saves it, and a pull request whose Cargo
      # files match main's restores main's cache and saves nothing. The
      # action sets CARGO_INCREMENTAL=0 for the job. Pinned to its full
      # commit; the workflow's permissions are unchanged. Approved on
      # OWL-289 on 2026-10-15, with the action as a dependency, as the
      # CI-settings floor of architecture section 8 requires.
      - name: Cache the build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # OWL-41: agent runs are confined with bwrap on Linux. The image keeps
      # unprivileged programs from creating user namespaces (AppArmor), so
      # bwrap alone is allowed them with a scoped profile, as on a user's
      # machine; the runner-wide sysctl is left as it is. The confinement
      # tests must then run, not skip. Approved on OWL-41 on 2026-09-29, as
      # the CI-settings floor of architecture section 8 requires.
      - name: Allow bwrap user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo install -m 0644 .github/apparmor/bwrap /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          echo "OWLSHIFT_REQUIRE_CONFINEMENT=1" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # OWL-106: a broken link in the docs of a public item goes unnoticed
      # until rustdoc runs. Approved on OWL-106 on 2026-10-01, as the
      # CI-settings floor of architecture section 8 requires.
      - name: Rustdoc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # OWL-241: the tests run under cargo-nextest, one process per test, so
      # a child forked by one test no longer holds another test's lock and
      # on_demand's tests use the runner's cores. Each process still warms
      # gh before its probes (`gh::warm_up`). OWL-81's separate step, which
      # ran on_demand alone on Windows, goes with on_demand's tests on that
      # leg (below). nextest comes from a third-party
      # action pinned to its full commit, with a pinned nextest; no retries.
      # nextest runs no doctests, so they keep a step of their own.
      # Approved on OWL-241 on 2026-10-12, with the action as a dependency,
      # as the CI-settings floor of architecture section 8 requires.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
      - name: Test
        if: runner.os != 'Windows'
        run: cargo nextest run --workspace --locked --no-fail-fast
      # OWL-241: on_demand runs `owlshift do` without confinement, which a
      # native Windows user cannot reach: `do` refuses there and WSL2 is the
      # supported path (D9, OWL-87). The refusals are tested outside that
      # binary, so they still run here.
      - name: Test, without on_demand
        if: runner.os == 'Windows'
        run: cargo nextest run --workspace --locked --no-fail-fast -E 'not binary_id(owlshift-testkit::on_demand)'
      - name: Doctests
        run: cargo test --workspace --doc --locked

  # The single check to require on main (OWL-21): it succeeds only when every
  # platform leg succeeded, and fails if one failed, was cancelled or skipped.
  ci:
    name: ci
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform leg to pass
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "check: $RESULT"
          test "$RESULT" = "success"
