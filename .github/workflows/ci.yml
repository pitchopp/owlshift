name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner images ship rustup; it installs the toolchain pinned in
      # rust-toolchain.toml, with rustfmt and clippy.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Show the toolchain
        run: cargo --version --verbose
      # OWL-41: agent runs are confined with bwrap on Linux. The image keeps
      # unprivileged programs from creating user namespaces (AppArmor), so
      # bwrap alone is allowed them with a scoped profile, as on a user's
      # machine; the runner-wide sysctl is left as it is. The confinement
      # tests must then run, not skip. Approved on OWL-41 on 2026-09-29, as
      # the CI-settings floor of architecture section 8 requires.
      - name: Allow bwrap user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo install -m 0644 .github/apparmor/bwrap /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          echo "OWLSHIFT_REQUIRE_CONFINEMENT=1" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The single check to require on main (OWL-21): it succeeds only when every
  # platform leg succeeded, and fails if one failed, was cancelled or skipped.
  ci:
    name: ci
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform leg to pass
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          echo "check: $RESULT"
          test "$RESULT" = "success"
