# Throwaway live checks for OWL-41 (confining agent runs). Runs only on
# pushes to the OWL-41 branch; removed before the pull request. Every secret
# is fake and made here.
name: owl41-probe

on:
  push:
    branches: [sghirma/owl-41-confine-agent-runs-at-the-os-level]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Plant fake secrets and a repository with a linked worktree
        run: |
          mkdir -p "$HOME/.config/gh" "$HOME/other-project" "$HOME/toolchain" "$HOME/owl41"
          printf 'example.invalid:\n    oauth_token: gho_FAKE_owl41\n' > "$HOME/.config/gh/hosts.yml"
          echo 'API_KEY=FAKE_owl41' > "$HOME/other-project/.env"
          echo tool > "$HOME/toolchain/bin.txt"
          cd "$HOME/owl41"
          git init -q -b main main && cd main
          git -c user.name=p -c user.email=p@example.invalid commit -q --allow-empty -m init
          git worktree add -q -b owl41 "$HOME/owl41/wt"
          cat > "$HOME/owl41/probe.sh" <<'EOF'
          #!/bin/sh
          cat "$HOME/.config/gh/hosts.yml" >/dev/null 2>&1; echo "  gh token file: exit $?"
          cat "$HOME/other-project/.env" >/dev/null 2>&1; echo "  sibling .env: exit $?"
          cat "$HOME/toolchain/bin.txt" >/dev/null 2>&1; echo "  allowed toolchain file: exit $?"
          ls "$HOME" >/dev/null 2>&1; echo "  list the home: exit $?"
          python3 -c "import socket; s = socket.socket(socket.AF_UNIX); s.connect('$BUS')" 2>/dev/null; echo "  connect to the session bus socket: exit $?"
          echo x > "$HOME/planted.txt" 2>/dev/null; echo "  write in the home: exit $?"
          echo x > "$HOME/owl41/wt/written.txt" 2>/dev/null; echo "  write in the worktree: exit $?"
          cd "$HOME/owl41/wt" && git add written.txt && git -c user.name=p -c user.email=p@example.invalid commit -q -m f && echo "  commit in the linked worktree: ok" || echo "  commit in the linked worktree: failed"
          EOF
          chmod +x "$HOME/owl41/probe.sh"
          echo "BUS=$XDG_RUNTIME_DIR/bus" >> "$GITHUB_ENV"
      - name: Unconfined
        run: |
          "$HOME/owl41/probe.sh"
          git -C "$HOME/owl41/wt" reset -q --hard HEAD~1
      - name: Landlock
        run: |
          cat > /tmp/ll.c <<'EOF'
          #define _GNU_SOURCE
          #include <linux/types.h>
          #include <sys/syscall.h>
          #include <sys/prctl.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <stdio.h>
          #include <string.h>
          struct ruleset_attr { __u64 fs; __u64 net; __u64 scoped; };
          struct path_beneath { __u64 allowed; __s32 fd; } __attribute__((packed));
          /* ll DIR... -- COMMAND ARGS: everything is denied but the DIRs. */
          int main(int argc, char **argv) {
            int abi = syscall(SYS_landlock_create_ruleset, NULL, 0, 1);
            fprintf(stderr, "landlock ABI %d\n", abi);
            if (abi < 1) return 90;
            __u64 fs = (1ULL << 13) - 1;
            if (abi >= 2) fs |= 1ULL << 13;
            if (abi >= 3) fs |= 1ULL << 14;
            if (abi >= 5) fs |= 1ULL << 15;
            struct ruleset_attr attr = { fs, 0, abi >= 6 ? 1 : 0 };
            size_t size = abi >= 6 ? 24 : (abi >= 4 ? 16 : 8);
            int rs = syscall(SYS_landlock_create_ruleset, &attr, size, 0);
            if (rs < 0) { perror("create_ruleset"); return 91; }
            int i = 1;
            for (; i < argc && strcmp(argv[i], "--"); i++) {
              struct path_beneath pb = { fs, open(argv[i], O_PATH | O_CLOEXEC) };
              if (pb.fd < 0) { perror(argv[i]); return 92; }
              if (syscall(SYS_landlock_add_rule, rs, 1, &pb, 0)) { perror("add_rule"); return 93; }
              close(pb.fd);
            }
            if (prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0)) { perror("no_new_privs"); return 94; }
            if (syscall(SYS_landlock_restrict_self, rs, 0)) { perror("restrict_self"); return 95; }
            execvp(argv[i + 1], argv + i + 1);
            perror("exec");
            return 96;
          }
          EOF
          gcc -O2 -o /tmp/ll /tmp/ll.c
          /tmp/ll /usr /bin /lib /lib64 /etc /proc /dev /tmp "$HOME/toolchain" "$HOME/owl41" -- "$HOME/owl41/probe.sh"
          git -C "$HOME/owl41/wt" reset -q --hard HEAD~1 || true
      - name: bwrap as installed from the archive
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap >/dev/null
          bwrap --version
          bwrap --ro-bind / / --dev /dev true && echo "bwrap: ok" || echo "bwrap: failed ($?)"
      - name: bwrap with an AppArmor profile granting it user namespaces
        run: |
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --dev /dev --proc /proc \
            --tmpfs "$HOME" \
            --ro-bind "$HOME/toolchain" "$HOME/toolchain" \
            --ro-bind "$HOME/owl41/probe.sh" "$HOME/owl41/probe.sh" \
            --bind "$HOME/owl41/wt" "$HOME/owl41/wt" \
            --bind "$HOME/owl41/main/.git" "$HOME/owl41/main/.git" \
            --tmpfs /run/user \
            --die-with-parent \
            -- "$HOME/owl41/probe.sh"
          echo "bwrap exit: $?"
          ls -A "$HOME"
          git -C "$HOME/owl41/wt" log --oneline -1
      - name: bwrap and a process group kill
        run: |
          setsid sh -c 'bwrap --ro-bind / / --dev /dev --proc /proc --die-with-parent -- sh -c "sleep 300 & sleep 301" & echo $! > /tmp/bw.pid; wait' &
          sleep 2
          PGID=$(ps -o pgid= -p "$(cat /tmp/bw.pid)" | tr -d ' ')
          ps -o pid,pgid,comm -g "$PGID"
          kill -KILL -- "-$PGID"
          sleep 1
          if pgrep -a -f 'sleep 30[01]'; then echo "a process survived the group kill"; else echo "no process left after the group kill"; fi
