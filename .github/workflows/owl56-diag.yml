# TEMPORARY (OWL-56): measures how long gh takes to answer `gh auth token`
# on the hosted runners, cold and warm. Removed before the pull request is
# ready for review.
name: OWL-56 diagnostics

on:
  push:
    branches: [sghirma/owl-56-fix-the-flaky-gh-auth-token-probe-on-windows-ci]

permissions:
  contents: read

jobs:
  gh-timing:
    name: gh timing (${{ matrix.os }}, ${{ matrix.first }}, ${{ matrix.rep }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        first: [single, triple]
        rep: [1, 2, 3]
        include:
          - os: ubuntu-latest
            first: single
            rep: 1
          - os: macos-latest
            first: single
            rep: 1
    runs-on: ${{ matrix.os }}
    steps:
      - name: Time gh auth token
        shell: pwsh
        env:
          GH_TOKEN: owlshift-agent-has-no-credential
          FIRST: ${{ matrix.first }}
        run: |
          $gh = (Get-Command gh).Source
          "gh at $gh, $((Get-Item $gh).Length) bytes"
          function Start-Gh {
            $psi = [Diagnostics.ProcessStartInfo]::new($gh)
            foreach ($a in @('auth', 'token', '--hostname', 'github.com')) { $psi.ArgumentList.Add($a) }
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.UseShellExecute = $false
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = [Diagnostics.Process]::Start($psi)
            [pscustomobject]@{ P = $p; Sw = $sw; Out = $p.StandardOutput.ReadToEndAsync(); Err = $p.StandardError.ReadToEndAsync() }
          }
          function Finish-Gh($run, [string]$label) {
            $null = $run.P.WaitForExit(120000)
            $exit = $run.Sw.Elapsed.TotalMilliseconds
            $null = $run.Out.Wait(120000); $null = $run.Err.Wait(120000)
            $eof = $run.Sw.Elapsed.TotalMilliseconds
            "{0,-10} exit {1,8:N0} ms  eof {2,8:N0} ms  code {3}  stdout {4} bytes" -f $label, $exit, $eof, $run.P.ExitCode, $run.Out.Result.Length
          }
          "--- first execution ($env:FIRST)"
          if ($env:FIRST -eq 'triple') {
            $runs = 1..3 | ForEach-Object { Start-Gh }
            $i = 0; foreach ($r in $runs) { $i++; Finish-Gh $r "cold-$i" }
          } else {
            Finish-Gh (Start-Gh) 'cold'
          }
          "--- warm, one at a time"
          1..5 | ForEach-Object { Finish-Gh (Start-Gh) "warm-$_" }
          "--- warm, three at once"
          $runs = 1..3 | ForEach-Object { Start-Gh }
          $i = 0; foreach ($r in $runs) { $i++; Finish-Gh $r "par-$i" }
          "--- context"
          & $gh --version
          if ($IsWindows) {
            Get-MpComputerStatus | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled | Format-List
            "exclusions: $((Get-MpPreference).ExclusionPath -join '; ')"
          }
