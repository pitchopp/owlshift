name: OWL-426 probe

# Temporary (OWL-426): why Windows refuses some reads of a project's
# obligations. Runs only on pushes to this ticket's branch, reads only, holds
# no secret, and is deleted before the pull request opens. Approved by the
# maintainer on 2026-10-23, recorded as a comment on OWL-426, as the
# CI-settings floor of architecture section 8 requires.

on:
  push:
    branches: [sghirma/owl-426-establish-why-windows-refuses-obligation-reads-and-keep-only]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Named as ci.yml's job, so the build cache main saved for Windows is reused.
  check:
    name: probe (windows-latest, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Cache the build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: The runner
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
          Get-MpComputerStatus -ErrorAction SilentlyContinue | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, BehaviorMonitorEnabled | Format-List
          Write-Output "TEMP: $env:TEMP"
          Get-Volume -DriveLetter $env:TEMP.Substring(0, 1) | Select-Object DriveLetter, FileSystem | Format-List
      - name: Build
        run: cargo test -p owlshift-runner --lib --locked --no-run
      - name: Probe
        shell: bash
        run: |
          set +e
          failed=0
          for round in $(seq 1 20); do
            for variant in link-delete move-delete link-rename move-rename; do
              OWL426_VARIANT=$variant cargo test -p owlshift-runner --lib --locked -q -- \
                --ignored --exact ticket_run::tests::owl426_probe --nocapture > out.txt 2>&1
              code=$?
              cat out.txt
              grep -q '^OWL426 summary' out.txt || code=98
              grep -q ' 1 passed' out.txt || code=99
              echo "OWL426 invocation round=$round variant=$variant code=$code"
              [ "$code" -eq 0 ] || failed=1
            done
            cargo test -p owlshift-runner --lib --locked -q -- \
              --exact ticket_run::tests::an_obligation_is_never_seen_partly_written > out.txt 2>&1
            code=$?
            cat out.txt
            echo "OWL426 baseline round=$round code=$code"
          done
          exit $failed
