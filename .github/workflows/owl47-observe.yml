# Temporary (OWL-47): observes a console Ctrl-C on `owlshift doctor` on
# windows-latest, with the test output shown. Approved by the maintainer on
# 2026-09-29 as a temporary change; removed before review.
name: OWL-47 observation

on:
  push:
    branches: [sghirma/owl-47-confirm-ctrl-c-stops-a-hung-doctor-probe-on-windows]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  observe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Ctrl-C on doctor, every case once
        continue-on-error: true
        run: cargo test -p owlshift-cli --test cli --locked ctrl_c -- --nocapture --test-threads=1
      - name: Ctrl-C on doctor, the probe that ignores it, five times
        run: |
          $passed = 0
          for ($i = 1; $i -le 5; $i++) {
            cargo test -p owlshift-cli --test cli --locked -- --exact ctrl_c_on_doctor_stops_a_probe_that_ignores_it_and_its_child --nocapture
            if ($LASTEXITCODE -eq 0) { $passed++ }
          }
          Write-Output "OWL-47: the probe that ignores Ctrl-C was stopped in $passed of 5 runs"
          exit 0
